<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-switch-container">
        <button class="theme-switch-btn">Toggle Theme</button>
    </div>
    <div class="lotto-machine">
        <h1>Lotto Number Generator</h1>
        <div class="numbers-display"></div>
        <button class="generate-btn">Generate Numbers</button>
    </div>
    <script src="main.js"></script>
    <div class="contact-form-container">
        <h2>Partnership Inquiry</h2>
        <form action="https://formspree.io/f/xkorqqen" method="POST" class="contact-form">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
            <button type="submit">Send Inquiry</button>
        </form>
    </div>
    <div id="disqus_thread"></div>
    <script>
        /**

        };

        var d = document, s = d.createElement('script');
        s.src = 'https://product-builder-lee.disqus.com/embed.js';

        (d.head || d.body).appendChild(s);
        })();
    </script>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
</body>
</html>
