<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물상 테스트 (강아지 vs 고양이)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">나는 강아지상일까, 고양이상일까?</h1>
            <p class="description">AI가 당신의 얼굴을 분석해 동물상을 찾아드립니다!</p>
            <input type="file" id="image-upload" accept="image/*">
            <label for="image-upload" class="custom-file-upload">사진 선택하기</label>
        </div>
        <div id="image-display-container">
            <img id="uploaded-image" src="#" alt="Uploaded Image" />
        </div>
        <div id="label-container"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
