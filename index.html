<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 저녁 뭐먹지?</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
</head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round"></div>
        </label>
    </div>
    <div class="container">
        <h1 class="title">오늘 저녁 뭐먹지?</h1>
        <button id="recommend-btn" class="recommend-btn">메뉴 추천 받기</button>
        <div id="menu-display" class="menu-display">
            <p class="placeholder">버튼을 눌러 추천을 받아보세요!</p>
        </div>
    </div>
    <script src="main.js?v=4"></script>
    <section class="contact-form-section">
        <h2>제휴 문의</h2>
        <form action="https://formspree.io/f/mvzrznve" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">이름:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">이메일:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">메시지:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="submit-btn">보내기</button>
        </form>
    </section>
</body>
</html>
